name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Start preview server
        # --background makes the daemon behavior explicit and deterministic
        # (astro preview auto-backgrounds itself in non-interactive shells
        # anyway, but relying on that heuristic in CI is asking for trouble).
        run: |
          npx astro preview --background --port 4321
          npx astro preview status

      - name: Wait for preview server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4321/Racing_event_tracker/ > /dev/null; then
              echo "Preview server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server did not become ready in time" >&2
          npx astro preview logs
          exit 1

      - run: npx playwright test

      - name: Stop preview server
        if: always()
        run: npx astro preview stop

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
