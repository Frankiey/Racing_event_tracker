name: PR Validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.x"
          enable-cache: true
      - run: npm test
      - run: npm run validate:data
      - run: npm run build
